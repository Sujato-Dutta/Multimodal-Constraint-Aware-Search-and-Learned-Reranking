services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: constraint_search_app
    ports:
      - "8000:8000"
    environment:
      - PINECONE_API_KEY=${PINECONE_API_KEY:-}
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./experiments:/app/experiments
    restart: unless-stopped
